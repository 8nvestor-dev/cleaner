name: 247_Cloud_Traffic_Farmer
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  surf_credits:
    runs-on: ubuntu-latest
    steps:
      - name: Run Otohits Cloud Container
        run: |
          docker run -d --name otohits-client \
            -e APPLICATION_KEY="a9e28065-a17e-4fe4-98d3-26824dd962ed" \
            -e OPTIONS="/autoupdate /nolog" \
            otohits/viewer:latest
          
          echo "Cloud engine started successfully! Farming points for 50 minutes..."
          sleep 3000
