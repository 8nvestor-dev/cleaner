name: 247_Cloud_Traffic_Farmer
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  surf_credits:
    runs-on: ubuntu-latest
    steps:
      - name: Execute 247 Credit Surf Script
        run: |
          python -c "
          import urllib.request
          import time
          # This connects directly to your Otohits account using your key
          autosurf_url = 'https://otohits.net'
          print('Starting cloud traffic farming session...')
          # This loop runs for 4 hours straight to maximize points
          for i in range(480): 
              try:
                  urllib.request.urlopen(autosurf_url, timeout=30)
                  time.sleep(30)
              except Exception as e:
                  pass
          "
